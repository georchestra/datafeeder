[tool.poe.tasks]
lint = "ruff check ."
"lint:fix" = "ruff check . --fix"

fmt = "ruff format . --check"
"fmt:fix" = "ruff format ."

[project]
name = "datafeeder-airflow-elt"
version = "0.1.0"
description = "Airflow DAGs for ELT in Datafeeder"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "data_manipulation",
    "apache-airflow==3.2.2",  # keep in sync with AIRFLOW_VERSION in docker/Dockerfile.airflow
    "apache-airflow-providers-postgres==6.7.0",
    # Required by docker/compose.airflow.yaml, which sets CeleryExecutor and
    # FabAuthManager. The apache/airflow image preinstalls both, but
    # docker/Dockerfile.airflow builds on the GDAL image and installs only what
    # this lock declares.
    "apache-airflow-providers-celery==3.20.0",
    "apache-airflow-providers-fab==3.6.4",
]

[dependency-groups]
dev = [
    "ruff>0",
    "poethepoet>0",
]

[tool.uv.workspace]
members = ["../../libs/data_manipulation"]

[tool.uv.sources]
data_manipulation = { workspace = true }
geoservercloud = { git = "https://github.com/camptocamp/python-geoservercloud.git" }

[tool.ruff]
extend = "../../ruff.toml"

