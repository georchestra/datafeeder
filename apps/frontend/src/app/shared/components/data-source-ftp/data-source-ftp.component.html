<div class="px-9 py-6">
  <div class="flex flex-wrap gap-4">
    <div class="form-field">
      <label class="form-label">
        {{ 'import.dataSource.ftp.host' | translate
        }}<span class="required">*</span>
      </label>
      <gn-ui-text-input
        [value]="formData().host"
        (valueChange)="set('host', $event)"
        placeholder=""
      ></gn-ui-text-input>
    </div>

    <div class="form-field w-[150px]">
      <label class="form-label">
        {{ 'import.dataSource.ftp.port' | translate
        }}<span class="required">*</span>
      </label>
      <gn-ui-text-input
        [value]="formData().port.toString()"
        (valueChange)="set('port', +$event)"
        placeholder=""
      ></gn-ui-text-input>
    </div>
  </div>

  <div class="flex flex-wrap gap-4 mt-4">
    <div class="form-field">
      <label class="form-label">
        {{ 'import.dataSource.ftp.username' | translate
        }}<span class="required">*</span>
      </label>
      <gn-ui-text-input
        [value]="formData().username"
        (valueChange)="set('username', $event)"
        placeholder=""
      ></gn-ui-text-input>
    </div>

    <div class="form-field">
      <label class="form-label">
        {{ 'import.dataSource.ftp.password' | translate
        }}<span class="required">*</span>
      </label>
      <app-ui-input-password
        [value]="formData().password"
        (valueChange)="set('password', $event)"
        placeholder=""
      />
    </div>
  </div>

  <div class="mt-8 pt-4 border-t border-gray-300">
    <label class="form-label">
      {{ 'import.dataSource.ftp.path' | translate
      }}<span class="required">*</span>
    </label>
    <gn-ui-text-input
      [value]="formData().path"
      (valueChange)="set('path', $event)"
      placeholder="/path/to/dataset.example"
    ></gn-ui-text-input>
  </div>
</div>
