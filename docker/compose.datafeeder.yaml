
services:
  datafeeder-frontend:
    profiles:
      - datafeeder
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
#    environment:
#        - OVERRIDE_BASE_HREF=ds
    ports:
      - "8001:8080"

  datafeeder-backend:
    profiles:
      - datafeeder
    build:
      context: ../
      dockerfile: ./apps/backend/Dockerfile
      target: development
    ports:
      - "8002:8000"
    volumes:
      - ./datadir:/etc/georchestra
      # for dev only
      - ../apps:/app/apps
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
      - /tmp/:/tmp:rw
    environment:
      - DATADIR=/etc/georchestra
    env_file:
      - .envs-common
      - .envs-ldap
      - .envs-hosts
      - .envs-database-georchestra
    restart: always

  # GDAL/ogr2ogr sidecar for the LOCAL task executor: datafeeder-backend has no GDAL
  # installed, so LocalTaskExecutor reaches ogr2ogr in this container via `docker exec`
  # instead (see apps/backend/src/services/executors/local_executor.py).
  datafeeder-gdal:
    profiles:
      - local-executor
    image: ghcr.io/osgeo/gdal:alpine-small-3.13.2
    container_name: datafeeder-gdal
    # Host networking so ogr2ogr reaches datadb the same way the host-run backend does
    # (localhost:5433, see POSTGRES_DATA_HOST/PORT in datafeeder.env) — the compose
    # bridge network's `datadb` DNS alias isn't reachable from the host process.
    network_mode: host
    entrypoint: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - /tmp/:/tmp:rw

  datadb:
    image: postgis/postgis
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres # default database
    volumes:
      - pg_data:/var/lib/postgresql/
      - ./data-db-init.sql:/docker-entrypoint-initdb.d/01-data-db-init.sql

volumes:
  pg_data:
