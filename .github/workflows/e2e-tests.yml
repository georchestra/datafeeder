name: Datafeeder E2E tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    name: E2E tests (${{ matrix.executor }} executor)
    timeout-minutes: 90

    # Same tests against both task executors: the backend running ingestion itself
    # (TASK_EXECUTOR=LOCAL), and Airflow running the DAGs (TASK_EXECUTOR=AIRFLOW).
    strategy:
      fail-fast: false
      matrix:
        include:
          - executor: local
            stack_target: up-no-airflow
            backend_target: run-backend-with-local-task-executor
            compose_profile: local-executor
          - executor: airflow
            stack_target: up
            backend_target: run-backend
            compose_profile: airflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The airflow image and services come on top of the whole georchestra stack,
      # which does not fit in the runner's default free disk space.
      - name: Free disk space
        if: matrix.executor == 'airflow'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      # Same layout as local dev: georchestra in Docker, backend and frontend on the
      # host, reached by the gateway through host.docker.internal.
      # - local: no Airflow, the backend runs ingestion itself, calling ogr2ogr in the
      #   datafeeder-gdal container.
      # - airflow: the backend triggers the DAGs through the Airflow API (localhost:8081),
      #   and the workers call the backend back through host.docker.internal.
      - name: Start Docker stack
        run: make ${{ matrix.stack_target }}

      # EPSG:2154 is needed by test_import_csv_lat_lon_2154, which skips itself otherwise
      - name: Start backend
        env:
          PROJECTIONS: '[{"value": "EPSG:4326", "label": "WGS 84"}, {"value": "EPSG:3857", "label": "Web Mercator"}, {"value": "EPSG:2154", "label": "RGF93 / Lambert-93"}]'
        run: nohup make ${{ matrix.backend_target }} BACKEND_RELOAD= > backend.log 2>&1 &

      - name: Install frontend deps
        working-directory: ./apps/frontend
        run: npm ci

      - name: Start frontend
        working-directory: ./apps/frontend
        run: nohup npm start > ../../frontend.log 2>&1 &

      # Direct then through the gateway, to tell a dead service from a routing issue.
      # The gateway only lets IMPORT users through, hence the test account.
      - name: Wait for backend and frontend
        run: |
          wait_for() {
            echo "Waiting for $1"
            timeout 300 bash -c "until curl -sf -u testadmin:testadmin -o /dev/null $1; do sleep 5; done" && return
            echo "::error::$1 not reachable"
            curl -sv -u testadmin:testadmin -o /dev/null "$1" || true
            tail -n 100 backend.log frontend.log
            return 1
          }
          wait_for http://localhost:8080/datafeeder-backend/openapi.json
          wait_for http://localhost:8080/dataset/

      - name: Install e2e deps
        working-directory: ./e2e-tests
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      # Credential tests skip themselves when a var is missing, so only write the set ones
      - name: Write credentials
        working-directory: ./e2e-tests
        env:
          FTP_HOST: ${{ secrets.E2E_FTP_HOST }}
          FTP_USER: ${{ secrets.E2E_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.E2E_FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.E2E_FTP_PATH }}
          BASIC_AUTH_URL: ${{ secrets.E2E_BASIC_AUTH_URL }}
          BASIC_AUTH_USER: ${{ secrets.E2E_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.E2E_BASIC_AUTH_PASSWORD }}
        run: |
          for name in FTP_HOST FTP_USER FTP_PASSWORD FTP_PATH BASIC_AUTH_URL BASIC_AUTH_USER BASIC_AUTH_PASSWORD; do
            if [ -n "${!name}" ]; then echo "$name=${!name}" >> .env; fi
          done

      # URL imports must reach the files server the tests start on the host, and the
      # stack's GeoServer, from both the host-run backend and the Airflow workers:
      # localhost only works for the former, so use the Docker bridge gateway (see
      # e2e-tests/README.md).
      - name: Set E2E_HOST
        if: matrix.executor == 'airflow'
        run: echo "E2E_HOST=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"

      - name: Run e2e tests
        working-directory: ./e2e-tests
        run: >
          uv run pytest -v
          --durations=10
          --tracing retain-on-failure
          --screenshot only-on-failure

      - name: Dump logs
        if: failure()
        run: |
          docker compose --profile ${{ matrix.compose_profile }} logs --no-color > docker-compose.log
          mkdir -p logs
          mv backend.log frontend.log docker-compose.log logs/
          # Airflow task logs, where the ingestion errors are
          if [ -d apps/elt/logs ]; then cp -r apps/elt/logs logs/airflow; fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.executor }}
          path: |
            e2e-tests/test-results
            logs
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: make down
